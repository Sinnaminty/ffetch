[package]
name = "ffetch"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.7", default-features = false, features = ["std", "parse"] }

[build-dependencies]
png = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
